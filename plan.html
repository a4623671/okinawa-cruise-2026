.item.skipped{opacity:.55}

.tag-warn{display:inline-block;font-size:11px;font-weight:800;background:#fdecea;color:#8c2f1d;border:1px solid #f2b8ae;border-radius:8px;padding:1px 6px;margin-left:5px}

button.go{border:none;border-radius:16px;background:#0e6e5a;color:#fff;font-weight:800;padding:8px 16px;font-size:14px;cursor:pointer}
button.ghost{border:1px solid #d8d0bd;background:#fff;border-radius:16px;padding:8px 14px;font-size:14px;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dbe3ec;padding:8px 12px;display:flex;gap:8px;align-items:center;z-index:31}

.pblock{border:1px solid #dbe3ec;border-radius:12px;overflow:hidden;margin-bottom:10px}

.prow{display:flex;gap:9px;align-items:center;padding:7px 10px;border-top:1px solid #eef2f6;background:#fff}

.pthumb{flex:none;width:52px;height:52px;border-radius:9px;overflow:hidden;background:#eef2f6;display:flex;align-items:center;justify-content:center;font-size:22px;color:#95a3b2}

.prow button{border:1px solid #cde3d3;background:#f4fbf6;color:#1e6b32;border-radius:12px;font-size:12px;padding:5px 12px;font-weight:700;cursor:pointer;flex:none}
.prow{cursor:pointer}
.mask{position:fixed;inset:0;background:rgba(8,20,32,.55);z-index:60;display:none;padding:16px;overflow:auto}
.mask.on{display:flex;align-items:center;justify-content:center}
.pd{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:88vh;overflow:auto;position:relative}
.pd .pdclose{position:absolute;top:8px;right:8px;border:none;background:rgba(0,0,0,.5);color:#fff;border-radius:50%;width:34px;height:34px;font-size:16px;line-height:1;cursor:pointer;z-index:3}

.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}

.slot.empty{min-height:0;padding:8px 11px;color:#95a3b2;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}

.menu button{display:block;width:100%;text-align:left;border:1px solid #dbe3ec;background:#fff;border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:8px;cursor:pointer}

#mapfab{position:fixed;right:12px;bottom:74px;z-index:32;width:54px;height:54px;border-radius:50%;border:1px solid #d8d0bd;background:#fff;font-size:24px;line-height:1;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.25)}
#mapfab:active{background:#f2f6fa}
#mapov{position:fixed;inset:0;background:rgba(8,20,32,.45);z-index:70;display:none;align-items:center;justify-content:center;padding:6px}
#mapov.on{display:flex}
#mapcard{background:#fff;border-radius:16px;width:100%;max-width:760px;height:94vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.4)}
#mapbar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:9px 12px;border-bottom:1px solid #dbe3ec;overflow:hidden;flex:none}
#mapbar::-webkit-scrollbar{display:none}#mapdays::-webkit-scrollbar{display:none}

#mapact>button{flex:none;border:1px solid #b9a86a;background:#fffdf3;color:#7a5200;border-radius:9px;padding:4px 8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}

#maplist{padding:6px 10px 12px}

.maprow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px dashed #eef2f6;background:#fff;touch-action:pan-y}

.mtot{padding:4px 10px;font-size:12px}

<body>
<div class="topbar">
  <div class="logo">🗓 排程板</div>

 </div>

<script>
/* ================= 基本 ================= */
var NKEY='discuss_name_v1';

function computeAll(){
 cache.legs={};cache.totals={};var jobs=[];
 function leg(k,mode,ca,cb){
  if(!ca||!cb){cache.legs[k]={min:null,km:null,src:'無座標',mode:mode,wait:null,ride:null};return;}
  var km=hav(ca,cb);
  if(mode==='taxi'||mode==='walk'){
   jobs.push(queryDrive(ca,cb).then(function(dr){var e=estMode(mode,km,dr);e.mode=mode;cache.legs[k]=e;}));
  }else{var e=estMode(mode,km,null);e.mode=mode;cache.legs[k]=e;}
 }
 DAYS.forEach(function(d){
  if(!d.plan)return;
  var it=PLAN.items[d.k];var pc=PORT[d.port];
  var seq=[];SLOTS.forEach(function(s){it.slots[s[0]].forEach(function(o){seq.push(o);});});
  if(!seq.length)return;
  var pm=it.portMode||(it.portMode={in:'mono',out:'mono'});
  var act=[];seq.forEach(function(o,i){if(!o.skip)act.push(i);});
  if(!act.length)return;
  var legAct=act.filter(function(i){return !seq[i].gap;});
  if(!legAct.length)return;
  var f=legAct[0];
  if(pc&&samePort(seq[f],d))leg(d.k+':in',pm.in||'mono',[pc.lat,pc.lng],coordOf(seq[f]));
  else cache.legs[d.k+':in']={min:null,km:null,src:'跨港',mode:'mono',wait:null,ride:null,cross:true};
  for(var k2=0;k2<legAct.length-1;k2++){
   var i=legAct[k2],j=legAct[k2+1];
   var mode=(it.legs[i]||{}).mode||'mono';
   if(!samePort(seq[i],d)||!samePort(seq[j],d)){cache.legs[d.k+':'+i]={min:null,km:null,src:'跨港',mode:mode,wait:null,ride:null,cross:true};continue;}
   leg(d.k+':'+i,mode,coordOf(seq[i]),coordOf(seq[j]));
  }
  var lastI=legAct[legAct.length-1];
  if(pc&&samePort(seq[lastI],d))leg(d.k+':out',pm.out||'mono',coordOf(seq[lastI]),[pc.lat,pc.lng]);
  else cache.legs[d.k+':out']={min:null,km:null,src:'跨港',mode:'mono',wait:null,ride:null,cross:true};
 });
 return Promise.all(jobs).then(function(){
  DAYS.forEach(function(d){
   if(!d.plan)return;
   var it=PLAN.items[d.k];var used=0,miss=false,wait=0,lastReal=null;
   var seq=[];SLOTS.forEach(function(s){it.slots[s[0]].forEach(function(o){seq.push(o);});});
   var act2=[];seq.forEach(function(o,i){if(!o.skip)act2.push(i);});
   var tm2=hm(dayOff(d));if(tm2==null)tm2=8*60;
   var LI2=cache.legs[d.k+':in'];
   if(!LI2||LI2.min==null)miss=true;else tm2+=LI2.min;
   act2.forEach(function(i){
    var o=seq[i];
    if(o.gap){used+=(+o.min||0);tm2+=(+o.min||0);return;}
    if(lastReal!=null){var L=cache.legs[d.k+':'+lastReal];if(!L||L.min==null)miss=true;else tm2+=L.min;}
    var nb=hm(o.from||o.notBefore);
    if(nb!=null&&tm2<nb){wait+=nb-tm2;tm2=nb;}
    used+=(+o.min||0);tm2+=(+o.min||0);
    lastReal=i;
   });
   var LO2=cache.legs[d.k+':out'];
   if(!LO2||LO2.min==null)miss=true;else tm2+=LO2.min;
   used+=wait;
   finish(d,used,miss);
  });
 });
}
function finish(d,used,miss){

function renderStatus(){

  SLOTS.forEach(function(s){it.slots[s[0]].forEach(function(o){tot++;if(agreed(o))ag++;});});});
 var s='<span>⏳ 截止 <b>'+DEADLINE.slice(5,10)+'</b>'+(left>0?'（剩 '+left+' 天）':'（已截止）')+'</span>';

function renderBoard(){

 var meal0=+(PLAN.items[curDay]&&PLAN.items[curDay].mealMin)||0;

 document.getElementById('dayinfo').innerHTML='<b>'+esc(d.t)+'</b>'
  +(d.arr?('・到港 '+d.arr):'')+(d.dep?('・離港 '+d.dep):'')
  +(dayOff(d)?('・下船 '+dayOff(d)):'')+(dayBoard(d)?('・上船 '+dayBoard(d)+' 前'):'')

 if(!d.plan){document.getElementById('warn').innerHTML='';document.getElementById('board').innerHTML='<div class="slot">此日無岸上規劃（登船／返抵）。</div>';renderStatus();return;}
 var w='';

 var out='';

  arr.forEach(function(o,idx){

   out+='<div class="item'+(o.skip?' skipped':'')+'" data-idx="'+idx+'" data-slot="'+s[0]+'"><div class="mv"><button onclick="moveUp(\''+s[0]+'\','+idx+')">▲</button><button onclick="moveDown(\''+s[0]+'\','+idx+')">▼</button></div><div class="body">'
    +'<div class="nm">'+esc(o.t)+(o.src==='user'?'<span class="src user">'+esc(o.by||'?')+' 提議</span>':'<span class="src ai">候選</span>')+((o.place&&dayPlaceOf(d)&&o.place!==dayPlaceOf(d))?'<span class="tag-warn">⚠️非本港</span>':'')+(o.skip?'<span class="tag-skip">⏭ 已跳過</span>':'')+(agreed(o)?'<span class="tag-ok">✅ 已確認</span>':'')+'</div>'
    +'<div class="meta">停留 '+fmtMin(o.min||60)+(o.lat!=null?'・📍':'・⚠️未定位')+'・附議 '+end.length+'/'+roster().length+(end.length?'（'+esc(end.join('、'))+'）':'')+(hold.length?'・再考慮 '+hold.length+'（'+esc(hold.join('、'))+'）':'')+'</div>'
    +'</div><div class="ops">'
    +'<button class="st'+(st==='yes'?' on':'')+'" onclick="toggleAgree(\''+s[0]+'\','+idx+')">附議</button>'
    +'<button class="st no'+(st==='no'?' on':'')+'" onclick="holdItem(\''+s[0]+'\','+idx+')">再考慮</button>'
    +'<button onclick="openItemMenu(\''+s[0]+'\','+idx+')">⋯</button>'
    +'</div></div>';
  });
  out+='</div>';
 });
 var seq=[];SLOTS.forEach(function(s){it.slots[s[0]].forEach(function(o){seq.push(o);});});
 if(seq.length){
  var pc=PORT[d.port];var pm=it.portMode||{in:'mono',out:'mono'};
  var actB=[];seq.forEach(function(o,i){if(!o.skip)actB.push(i);});
  var keys=[curDay+':in'];for(var j2=0;j2<actB.length-1;j2++)keys.push(curDay+':'+actB[j2]);keys.push(curDay+':out');
  var tmin=0,unk=false;
  keys.forEach(function(k){var C=cache.legs[k];if(!C||C.min==null)unk=true;else tmin+=C.min;});
  var open=!!legOpen[curDay];
  out+='<div class="slot"><h3 class="leghead" onclick="toggleLegs()">🚕 交通 '+keys.length+' 段・'+(unk?'部分未知':'約 '+fmtMin(tmin))+' <span class="chev">'+(open?'▾ 收合':'▸ 展開')+'</span></h3>';
  if(open){
   out+=portLegRow('in','港口（'+(pc?pc.n:d.port)+'） → '+esc(seq[0].t.slice(0,14)),cache.legs[curDay+':in'],pm.in||'mono');
   for(var ai=0;ai<actB.length-1;ai++){
    var i=actB[ai],nx=actB[ai+1];
    var L=it.legs[i]||{};var C=cache.legs[curDay+':'+i]||{};var cur=L.mode||'mono';
    out+='<div class="leg"><div style="font-weight:700">'+(ai+1)+'. '+esc(seq[i].t.slice(0,14))+' → '+esc(seq[nx].t.slice(0,14))+'</div><div class="row" style="margin-top:4px">';
    out+=['walk','taxi','bus','mono'].map(function(m){return '<button class="'+(cur===m?'on':'')+'" onclick="setLeg('+i+',\''+m+'\')">'+MODEN[m]+'</button>';}).join('');
    out+=legEst(C);
    out+='</div></div>';
   }
   out+=portLegRow('out',esc(seq[seq.length-1].t.slice(0,14))+' → 港口（'+(pc?pc.n:d.port)+'）',cache.legs[curDay+':out'],pm.out||'mono');
  }
  out+='</div>';
 }
 document.getElementById('board').innerHTML=out;
 renderStatus();
}

function legEst(C){
 if(C&&C.cross)return '<span class="est" style="color:#c0392b">⚠️ 跨港／非本港，無法估算</span>';
 var brk=(!C||C.min==null||!C.wait)?'':('（等 '+Math.round(C.wait)+'＋搭 '+Math.round(C.ride)+' 分）');
 return '<span class="est">'+((C&&C.min!=null)?('約 '+fmtMin(C.min)+brk+(C.km?'・'+C.km.toFixed(1)+'km':'')):'時間未知')+'</span>';
}
function portLegRow(which,label,C,cur){
 var h='<div class="leg"><div style="font-weight:700">'+label+'</div><div class="row" style="margin-top:4px">';
 h+=['walk','taxi','bus','mono'].map(function(m){return '<button class="'+(cur===m?'on':'')+'" onclick="setPortMode(\''+which+'\',\''+m+'\')">'+MODEN[m]+'</button>';}).join('');
 h+=legEst(C)+'</div></div>';
 return h;
}

var legOpen={};

function openItemMenu(slot,idx){

 h+='<button onclick="closeItemMenu();setMin(\''+slot+'\','+idx+')">⏱ 停留時間（目前 '+fmtMin(o.min||60)+'）</button>';

 if(o.lat==null&&!o.gap)h+='<button onclick="closeItemMenu();locate(\''+slot+'\','+idx+')">📍 查座標</button>';

function moveUp(slot,idx){if(guard())return;var a=arr0(slot);if(idx<=0){toast('已在最前面');return;}var t=a[idx-1];a[idx-1]=a[idx];a[idx]=t;recompute();}
function moveDown(slot,idx){if(guard())return;var a=arr0(slot);if(idx>=a.length-1){toast('已在最後面');return;}var t=a[idx+1];a[idx+1]=a[idx];a[idx]=t;recompute();}
function moveToSlot(slot,idx,target){if(guard())return;if(slot===target)return;var a=arr0(slot);var o=a.splice(idx,1)[0];it0().slots[target].push(o);recompute();toast('已移到「'+SLOTN[target]+'」');}

/* ================= 操作 ================= */
function arr0(slot){return it0().slots[slot];}
function setMeal(){if(guard())return;var it=it0();var v=prompt('這天要扣多少用餐時間（分鐘）？',it.mealMin==null?60:it.mealMin);if(v===null)return;var n=parseInt(v,10);if(isNaN(n)||n<0){toast('請輸入 0 或正整數');return;}it.mealMin=n;recompute();}
function toggleSkip(slot,idx){if(guard())return;var o=arr0(slot)[idx];if(!o)return;o.skip=!o.skip;if(!o.skip)delete o.skip;recompute().then(function(){drawPlanMap();});}
function setMin(slot,idx){if(guard())return;var o=arr0(slot)[idx];var v=prompt('停留幾分鐘？',o.min||60);if(v===null)return;var n=parseInt(v,10);if(!(n>0)){toast('請輸入分鐘數');return;}o.min=n;recompute();}
function rmItem(slot,idx){if(guard())return;var a=arr0(slot);var o=a[idx];if(!confirm('移除「'+o.t+'」？'))return;a.splice(idx,1);recompute();}
function toggleAgree(slot,idx){if(guard())return;setStance(arr0(slot)[idx],'yes');recompute();}
function holdItem(slot,idx){if(guard())return;setStance(arr0(slot)[idx],'no');recompute();}
function locate(slot,idx){if(guard())return;var o=arr0(slot)[idx];toast('查座標…');
 resolveGeo({t:o.t,place:o.place||null,id:o.id}).then(function(c){
  if(c){o.lat=c[0];o.lng=c[1];delete o.geoFail;recompute();toast('已定位');return;}
  var v=prompt('自動查不到「'+gTitle(o)+'」的座標。\n可貼 Google 地圖連結或「緯度,經度」：','');
  if(!v)return;
  var m=String(v).match(/(-?\d{1,3}\.\d{1,})[,\s]+(-?\d{1,3}\.\d{1,})/);
  if(!m||Math.abs(+m[1])>90||Math.abs(+m[2])>180){toast('格式看不懂：請貼「24.81,125.28」或含 @lat,lng 的地圖連結');return;}
  o.lat=parseFloat(m[1]);o.lng=parseFloat(m[2]);delete o.geoFail;recompute();toast('已手動定位');
 });}
function setLeg(i,mode){if(guard())return;var it=it0();var L=it.legs[i]||(it.legs[i]={});L.mode=mode;delete L.prop;delete L.by;delete L.endorse;delete L.hold;recompute();}
function setPortMode(which,mode){if(guard())return;var it=it0();it.portMode=it.portMode||{in:'mono',out:'mono'};it.portMode[which]=mode;recompute();}
var undoStack=[],lastSnap=null;
function recompute(){
 try{
  var cur=JSON.stringify(PLAN);
  if(lastSnap==null)lastSnap=cur;
  else if(cur!==lastSnap){undoStack.push(lastSnap);if(undoStack.length>30)undoStack.shift();lastSnap=cur;}
 }catch(e){}
 saveQuiet();return computeAll().then(function(){renderBoard();});}
function undoStep(){
 if(!undoStack.length){toast('沒有可回上一步的動作');return;}
 if(guard())return;
 PLAN=JSON.parse(undoStack.pop());
 ensure(PLAN);lastSnap=JSON.stringify(PLAN);
 recompute().then(function(){drawPlanMap();renderDays();});
 toast('↩︎ 已回上一步（還可回 '+undoStack.length+' 步）');
}
function saveSnapshot(){
 if(!PLAN){toast('尚未載入');return;}
 var url=REPO+'history/plan-latest.json';
 var body={message:'plan snapshot '+new Date().toISOString(),content:btoa(unescape(encodeURIComponent(JSON.stringify(PLAN))))};
 var put=function(sha){if(sha)body.sha=sha;return fetch(url,{method:'PUT',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+GH_TOKEN,'Content-Type':'application/json'},body:JSON.stringify(body)});};
 fetch(url,{headers:ghH(),cache:'no-store'}).then(function(r){return r.ok?r.json():null;})
  .then(function(j){return put(j?j.sha:null);})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);toast('💾 已存檔（可隨時按「📥 還原」回復）');})
  .catch(function(e){toast('存檔失敗：'+(e.message||e));});
}
function restoreSnapshot(){
 if(!PLAN){toast('尚未載入');return;}
 if(guard())return;
 fetch(REPO+'history/plan-latest.json',{headers:ghH(),cache:'no-store'}).then(function(r){return r.ok?r.json():null;})
  .then(function(j){
   if(!j||!j.content){toast('還沒有存檔（先按「💾 存檔」）');return;}
   var snap=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\s/g,'')))));
   if(!confirm('還原到上次存檔？（目前內容會被覆蓋，可用「↩︎ 上一步」再回復）'))return;
   undoStack.push(JSON.stringify(PLAN));if(undoStack.length>30)undoStack.shift();
   PLAN=snap;ensure(PLAN);lastSnap=null;
   recompute().then(function(){drawPlanMap();renderDays();});
   toast('📥 已還原存檔');
  }).catch(function(e){toast('還原失敗：'+(e.message||e));});
}

var KINDS=[
 {k:'spot',n:'📷 景點',bg:'#e8f0fb',fg:'#2b4d8f',bd:'#b9cdf0'},
 {k:'food',n:'🍜 餐廳',bg:'#fdeeea',fg:'#b3541e',bd:'#f0c9bd'},
 {k:'shop',n:'🛍 購物',bg:'#eafaf1',fg:'#1e6b32',bd:'#bfe6cd'},
 {k:'souv',n:'🎁 伴手禮',bg:'#fff6e0',fg:'#8a5a00',bd:'#ecd79a'},
 {k:'feat',n:'✨ 特色',bg:'#f3ecfb',fg:'#6b3fa0',bd:'#d5c2ee'}];
function dayPlaceOf(d){var p=d&&d.port;return p==='那霸'?'naha':p==='宮古島'?'miyako':p==='石垣島'?'ishigaki':null;}
function dayPlace(){return dayPlaceOf(d0());}
function samePort(o,d){var dp=dayPlaceOf(d);return !o.place||!dp||o.place===dp;}
function votesOf(id){return (VOTES&&VOTES[id])||[];}
function isAdded(id){var f=false;DAYS.forEach(function(d){SLOTS.forEach(function(s){(PLAN.items[d.k].slots[s[0]]||[]).forEach(function(o){if(o.id===id)f=true;});});});return f;}
function poolList(){
 var dp=dayPlace();
 var list=CATALOG.filter(function(c){return !dp||c.place===dp;});
 var flat=[];
 KINDS.forEach(function(K){
  var arr=list.filter(function(c){return c.kind===K.k;});
  arr.sort(function(a,b){return votesOf(b.id).length-votesOf(a.id).length||a.id.localeCompare(b.id,undefined,{numeric:true});});
  arr.forEach(function(c){flat.push(c);});
 });
 return flat;}

function closePool(){document.getElementById('pool').classList.remove('on');closePdetail();}

    +'<div class="pbody"><div class="pname">'+esc(c.t)+'</div><div class="pvote">'+vt+'</div></div>'
    +'<button onclick="event.stopPropagation();addItem(\''+c.id+'\')">'+(ad?'再加':'加入')+'</button></div>';}).join('');

function pdNav(d){var n=PD_I+d;if(n<0||n>=POOL_LIST.length){toast(d<0?'已是第一項':'已是最後一項');return;}

function pdAdd(){var c=POOL_LIST[PD_I];if(!c)return;addItem(c.id);renderPdetail();}
function addItem(id){
 if(guard())return;
 var c=CATALOG.filter(function(x){return x.id===id;})[0];if(!c)return;
 var slot='afternoon';var a=it0().slots[slot];
 var o={id:c.id,t:c.t,kind:c.kind,place:c.place,min:(c.kind==='food'?60:c.kind==='spot'?90:45),
  src:'user',by:me()||'?',endorse:[]};
 var g=geo[c.id];if(g&&g.lat!=null){o.lat=g.lat;o.lng=g.lng;}
 a.push(o);
 if(document.getElementById('pool').classList.contains('on'))renderPool();
 if(o.lat!=null){toast('已加入「'+c.t.slice(0,12)+'」');recompute();}
 else{renderBoard();saveQuiet();toast('已加入（未定位，正在查座標…）');}
 if(o.lat==null)resolveGeo({t:c.t,place:c.place,id:c.id}).then(function(cc){
  if(cc){o.lat=cc[0];o.lng=cc[1];recompute();toast('已定位：'+c.t.slice(0,10));}});
}

/* ================= P4 規劃單 ================= */
function dayPlan(d){
 var out={rows:[],end:null,over:0,miss:false,skipped:0};
 if(!d.plan)return out;
 var it=PLAN.items[d.k];var t=hm(dayOff(d));if(t==null)t=8*60;
 var seq=[];SLOTS.forEach(function(s){it.slots[s[0]].forEach(function(o){seq.push(o);});});
 var pc=PORT[d.port];
 var act=[];seq.forEach(function(o,i){if(!o.skip)act.push(i);else out.skipped++;});
 if(!act.length)return out;
 var LI=cache.legs[d.k+':in'];
 if(LI&&LI.min!=null){out.rows.push({t:hm2s(t),n:'從港口出發（'+(pc?pc.n:d.port)+'）',min:LI.min,kind:'leg'});t+=LI.min;}else out.miss=true;
 var lastReal=null;var pendGaps=[];
 act.forEach(function(i){
  var o=seq[i];
  if(o.gap&&o.after){pendGaps.push({o:o,i:i});return;}
  if(o.gap){out.rows.push({t:hm2s(t),n:o.t,min:(+o.min||0),kind:'gap'});t+=(+o.min||0);return;}
  if(lastReal!=null){
   var L=cache.legs[d.k+':'+lastReal];
   if(!L||L.min==null){out.miss=true;}
   else{out.rows.push({t:hm2s(t),n:(MODEN[L.mode]||L.mode)+(L.wait?('（等'+Math.round(L.wait)+'＋搭'+Math.round(L.ride)+'）'):''),min:L.min,kind:'leg'});t+=L.min;}
  }
  pendGaps.forEach(function(g){out.rows.push({t:hm2s(t),n:g.o.t+'（交通後）',min:(+g.o.min||0),kind:'gap'});t+=(+g.o.min||0);});
  pendGaps=[];
  var nb=hm(o.from||o.notBefore);
  if(nb!=null&&t<nb){out.rows.push({t:hm2s(t),n:'⏳ 等待（'+(o.from||o.notBefore)+' 起）',min:nb-t,kind:'wait'});t=nb;}
  out.rows.push({t:hm2s(t),n:o.t,min:(+o.min||0),kind:'item'});
  t+=(+o.min||0);
  lastReal=i;
 });
 pendGaps.forEach(function(g){out.rows.push({t:hm2s(t),n:g.o.t+'（交通後）',min:(+g.o.min||0),kind:'gap'});t+=(+g.o.min||0);});
 var LO=cache.legs[d.k+':out'];
 if(LO&&LO.min!=null){out.rows.push({t:hm2s(t),n:'回港口（'+(pc?pc.n:d.port)+'）',min:LO.min,kind:'leg'});t+=LO.min;}else out.miss=true;
 out.end=t;
 var meal=(+it.mealMin)||0;if(meal)t+=meal;
 if(dayBoard(d)){var by=hm(dayBoard(d));if(by!=null){out.over=Math.max(0,t-by);
  if(meal&&out.rows.length)out.rows.push({t:'用餐',n:'用餐（扣抵）',min:meal,kind:'meal'});
  out.rows.push({t:hm2s(by),n:'上船（'+dayBoard(d)+'）',min:0,kind:'ret'});}}
 return out;}

   +'</table></div>';
 });
 h+='<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">'

}

function finalizePlan(){

function mapMove(slot,idx,dir){
 if(guard())return;
 var flat=[];SLOTS.forEach(function(s){arr0(s[0]).forEach(function(o,i){flat.push({s:s[0],i:i,o:o});});});
 var pos=-1;for(var j=0;j<flat.length;j++){if(flat[j].s===slot&&flat[j].i===idx){pos=j;break;}}
 if(pos<0)return;
 var j2=pos+dir;
 if(j2<0||j2>=flat.length){toast(dir<0?'已在最前':'已在最後');return;}
 var objs=flat.map(function(x){return x.o;});
 var tmp=objs[pos];objs[pos]=objs[j2];objs[j2]=tmp;
 var cur=0;
 SLOTS.forEach(function(s){var a=arr0(s[0]);var len=a.length;for(var q=0;q<len;q++){a[q]=objs[cur++];}});
 recompute().then(function(){drawPlanMap();});
}

function autoOrderMap(){
 if(guard())return;
 var it=it0(),pc=PORT[d0().port];
 var seq=[];SLOTS.forEach(function(s){it.slots[s[0]].forEach(function(o){seq.push(o);});});
 if(seq.length<2){toast('至少要有 2 個項目');return;}
 var withC=seq.filter(function(o){return coordOf(o);});
 var noC=seq.filter(function(o){return !coordOf(o);});
 if(withC.length<2){toast('已定位的項目不足 2 個（用 ⋯ → 📍 補）');return;}
 var prev=pc?[pc.lat,pc.lng]:coordOf(withC[0]);
 var rest=withC.slice(),order=[];
 while(rest.length){
  var bi=0,bd=1e9;
  rest.forEach(function(o,i){var c=coordOf(o),dd=hav(prev,c);if(dd<bd){bd=dd;bi=i;}});
  var o=rest.splice(bi,1)[0];order.push(o);prev=coordOf(o);
 }
 function total(arr){var s=0,pr=pc?[pc.lat,pc.lng]:coordOf(arr[0]);arr.forEach(function(o){var c=coordOf(o);s+=hav(pr,c);pr=c;});return s;}
 var best=order.slice(),bestD=total(best),changed=true,guardN=0;
 while(changed&&guardN++<30){
  changed=false;
  for(var i=0;i<best.length-1&&!changed;i++){
   for(var j=i+1;j<best.length;j++){
    var cand=best.slice(0,i).concat(best.slice(i,j+1).reverse(),best.slice(j+1));
    var dd=total(cand);
    if(dd<bestD-1e-6){best=cand;bestD=dd;changed=true;break;}
   }
  }
 }
 var final=best.concat(noC);
 var counts=SLOTS.map(function(s){return it.slots[s[0]].length;});
 var k=0;
 SLOTS.forEach(function(s,si){
  var take=(si===SLOTS.length-1)?final.length-k:counts[si];
  it.slots[s[0]]=final.slice(k,k+take);k+=take;
 });
 recompute().then(function(){drawPlanMap();toast('已依距離重新排序');});
}

function drawSubDay(){

 if(!p){closeSub();return;}
 var pc=coordOf(p);
 var sb=document.getElementById('subbar');sb.classList.add('on');
 sb.innerHTML='<button onclick="closeSub()">◀ 回主行程</button><span class="st">🧭 周邊：'+esc(p.t)+'</span><button onclick="addSub()">＋ 周邊</button>';
 mapClear();
 var subs=subOf(p),loc=[],miss=0;
 subs.forEach(function(s,i){if(s.lat!=null)loc.push({c:[s.lat,s.lng],s:s,i:i});else miss++;});
 if(pc){var mk0=L.marker(pc,{icon:L.divIcon({className:'',html:'<div style="background:#94a3b8;color:#fff;min-width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;border:2px solid #fff;opacity:.9">★</div>',iconSize:[26,26]})});
  mk0.addTo(PMAP).bindTooltip('★ 主點（參考・不列入路線）',{permanent:true,direction:'top',offset:[0,-14],className:'porttip'});}

 for(var i=0;i<loc.length-1;i++){
  (function(k){
   var A=loc[k].c,B=loc[k+1].c;
   var mode=(p.subLegs&&p.subLegs[loc[k].i]&&p.subLegs[loc[k].i].mode)||'mono';
   chain=chain.then(function(){return subLeg(A,B,mode).then(function(e){legs[loc[k+1].i]=e;});});
  })(i);
 }
 chain.then(function(){
  if(loc.length>1)L.polyline(loc.map(function(x){return x.c;}),{color:'#7a3fa0',weight:3,opacity:.85,dashArray:'6 5'}).addTo(PMAP);
  var bounds=[];

   var mk=L.marker(x.c,{icon:L.divIcon({className:'',html:pinHTML((x.s.note?'📝':(k+1)),(x.s.note?'#b3541e':'#7a3fa0'),26),iconSize:[26,26]})})
    .addTo(PMAP).bindPopup(subPopup(x.s,x.i));
   mk.bindTooltip((x.s.note?'📝 ':(k+1)+'. ')+String(x.s.t).slice(0,12),{permanent:true,direction:'right',offset:[10,0],className:'pintip'});
   bounds.push(x.c);
  });
  if(pc)bounds.push(pc);
  if(bounds.length){try{PMAP.fitBounds(bounds,{padding:[40,40]});}catch(e){PMAP.setView(bounds[0],15);}}
  var t=0,tot=0,strip='<div class="mstrip">';
  if(!subs.length){
   strip+='<div class="mcard port"><div class="nm">★ 主點</div><div class="sub">'+esc(String(p.t).slice(0,10))+'</div><div style="font-size:9.5px;color:#cfe0ee">停留 '+fmtMin(p.min||0)+'</div></div>';
   strip+='<div class="mcard" style="width:120px;align-items:center;justify-content:center" onclick="addSub()"><div class="nm">＋ 周邊</div><div class="sub" style="color:#6b7a89">加入附近或手動</div></div>';
  }else{
   subs.forEach(function(s,i){
    var C=legs[i];
    if(C){t+=C.min;tot+=C.min;strip+='<div class="mleg" onclick="subLegMenu('+i+')"><div class="mi">'+((MODEN[C.mode])||'')+'</div><div class="mm">'+(C.min!=null?fmtMin(C.min):'未知')+'</div><div class="msw">選擇</div></div>';}
    strip+='<div class="mcard" onclick="subFocus('+i+')">'
     +'<div class="nm">'+(s.note?'📝 ':(locIndex(loc,i)+1)+'. ')+esc(s.t)+'</div>'
     +'<div class="sub">'+(s.note?'註解':('+'+fmtMin(t)+'・停留 '+fmtMin(s.min||0)))+'</div>'
     +'<div class="act">'
     +'<button onclick="event.stopPropagation();subMove('+i+',-1)">◀</button>'
     +'<button onclick="event.stopPropagation();subMove('+i+',1)">▶</button>'
     +'<button onclick="event.stopPropagation();subSetMin('+i+')">⏱</button>'
     +'<button class="del" onclick="event.stopPropagation();subRemove('+i+')">✕</button>'
     +'</div></div>';
    if(!s.note){t+=(+s.min||0);tot+=(+s.min||0);}
   });
  }
  strip+='</div>';
  var over=Math.max(0,tot-(+p.min||0));
  var foot='<div class="mtot">週邊已排 <b>'+fmtMin(tot)+'</b>／主點停留 <b>'+fmtMin(p.min||0)+'</b>'+(over>0?' <span style="color:#b3402a">超過 '+fmtMin(over)+'</span>':'')+(miss?'　<span style="color:#b3541e">未定位 '+miss+' 項</span>':'')+(loc.length>1?'　<span style="color:#6b7a89">路線：週邊之間（不含主點往返）</span>':'')+'</div>';
  document.getElementById('maplist').innerHTML=foot+strip;
  setTimeout(function(){try{PMAP.invalidateSize();}catch(e){}},150);
 });
}
function locIndex(loc,i){for(var k=0;k<loc.length;k++)if(loc[k].i===i)return k;return -1;}
function subLegMenu(k){
 var p=arr0(MSUB.slot)[MSUB.idx];if(!p)return;
 var subs=p.sub||[];
 var loc=[];subs.forEach(function(s,i){if(s.lat!=null)loc.push({c:[s.lat,s.lng],i:i});});
 var pos=locIndex(loc,k);if(pos<1){toast('這是第一站，沒有前一段');return;}
 var A=loc[pos-1],B=loc[pos];
 var cur=(p.subLegs&&p.subLegs[k]&&p.subLegs[k].mode)||'mono';
 document.getElementById('imenubody').innerHTML='<h2>選擇交通</h2><div class="menu"><button>計算中…</button></div>';
 document.getElementById('imenu').classList.add('on');
 var km=hav(A.c,B.c);
 Promise.all(['walk','taxi','bus','mono'].map(function(m){
  if(m==='walk'||m==='taxi')return queryDrive(A.c,B.c).then(function(dr){var e=estMode(m,km,dr);return {m:m,min:e.min};}).catch(function(){return {m:m,min:null};});
  var e=estMode(m,km,null);return {m:m,min:e.min};
 })).then(function(list){
  var hh='<h2>選擇交通</h2><div class="menu">';
  list.forEach(function(x){hh+='<button'+(x.m===cur?' style="border-color:#10293f;background:#eef4f9;font-weight:800"':'')+' onclick="closeItemMenu();setSubLeg('+k+',\''+x.m+'\')">'+MODEN[x.m]+'　'+(x.min!=null?'約 '+fmtMin(Math.round(x.min)):'未知')+(x.m===cur?'（目前）':'')+'</button>';});
  hh+='<button onclick="closeItemMenu()">取消</button></div>';
  document.getElementById('imenubody').innerHTML=hh;
 });
}
function setSubLeg(k,m){var p=arr0(MSUB.slot)[MSUB.idx];if(!p)return;p.subLegs=p.subLegs||{};p.subLegs[k]={mode:m};recomputeSub();}
function addSub(){
 var p=arr0(MSUB.slot)[MSUB.idx];if(!p)return;
 var pc=coordOf(p),near=[];
 if(pc){CATALOG.forEach(function(c){var g=geo[c.id];if(!g||g.lat==null)return;var dkm=hav(pc,[g.lat,g.lng]);if(dkm<=1.5)near.push({c:c,g:g,d:dkm});});}
 near.sort(function(a,b){return a.d-b.d;});
 var h='<h2>＋ 加入週邊</h2><div class="menu">';
 if(near.length){h+='<div style="font-size:12px;color:#6b7a89;margin:2px 0 6px">主點周邊 1.5km 內的候選</div>';near.slice(0,8).forEach(function(x){h+='<button onclick="closeItemMenu();subAddAt(\''+x.c.id+'\')">'+esc(x.c.t)+'　<span style="color:#95a3b2">'+x.d.toFixed(1)+'km</span></button>';});}
 else h+='<div style="font-size:12px;color:#6b7a89;margin:2px 0 6px">附近沒有已定位的候選</div>';
 h+='<button onclick="closeItemMenu();subAddManual()">✏️ 手動新增（輸入名稱，會查座標）</button><button onclick="closeItemMenu();subAddNote()">📝 加註解（純文字，用主點位置打點）</button><button onclick="closeItemMenu()">取消</button></div>';
 document.getElementById('imenubody').innerHTML=h;
 document.getElementById('imenu').classList.add('on');
}
function subAddAt(cid){
 var c=null;CATALOG.forEach(function(x){if(x.id===cid)c=x;});if(!c)return;
 var g=geo[cid];if(!g||g.lat==null){toast('此候選沒有座標');return;}
 var p=arr0(MSUB.slot)[MSUB.idx];
 subOf(p).push({t:String(c.t).replace(/✅/g,'').trim(),min:c.kind==='food'?60:30,lat:g.lat,lng:g.lng,kind:c.kind,id:cid});
 recomputeSub();
}
function subAddNote(){
 var p=arr0(MSUB.slot)[MSUB.idx];if(!p)return;
 var txt=prompt('註解內容（例如：這裡買藥妝、集合點、拍照）','');if(!txt)return;
 var pc=coordOf(p);
 if(!pc){toast('主點沒有座標，無法打點');return;}
 subOf(p).push({t:String(txt),min:0,lat:pc[0],lng:pc[1],kind:'note',note:true});
 recomputeSub();
}
function subAddManual(){
 var p=arr0(MSUB.slot)[MSUB.idx];if(!p)return;
 var name=prompt('週邊名稱（例如：商店街、公園）','');if(!name)return;
 var mins=prompt('停留幾分鐘？','30');var m=parseInt(mins,10);if(!(m>0))m=30;
 toast('查座標…');
 resolveGeo({t:name,place:dayPlace(),id:'sub-'+Date.now()}).then(function(c){
  if(!c){toast('查不到座標');return;}
  subOf(p).push({t:name,min:m,lat:c[0],lng:c[1],kind:'spot'});
  recomputeSub();
 });
}

</script>
