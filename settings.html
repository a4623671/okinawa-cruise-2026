<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>設定・MSC榮耀號沖繩5日</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:#f4f1ea;color:#2b2b2b;line-height:1.6;padding:14px;max-width:640px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.topbar a{font-size:14px;color:#10293f;text-decoration:none;font-weight:700}
h1{font-size:20px;margin-bottom:2px}.sub{font-size:13px;color:#888;margin-bottom:14px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.card h2{font-size:16px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.row label{flex:1}
.row input{width:90px;border:1px solid #d8d0bd;border-radius:8px;padding:6px 8px;font-size:15px;text-align:right}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:12px;font-size:16px;font-weight:700;background:#10293f;color:#fff;cursor:pointer;margin-top:6px}
.btn.ghost{background:#fff;color:#10293f;border:1px solid #d8d0bd}
.rule{font-size:13px;color:#555;margin:4px 0}
.rule b{color:#b3541e}
#msg{font-size:13px;color:#0e6e5a;text-align:center;margin-top:8px;min-height:20px}
.note{font-size:12px;color:#999;text-align:center;padding:12px 0 40px}
</style>
</head>
<body>
<div class="topbar"><a href="index.html">‹ 返回入口</a></div>
<h1>⚙️ 設定</h1>
<div class="sub">規劃參數存本機（換手機需重設）・版本 20260909-z</div>
<div class="card"><h2>📐 動態規劃參數</h2>
<div class="row"><label>D2 宮古島活動預算（分）</label><input id="cfg_d2" type="number" min="0" max="720"></div>
<div class="row"><label>D3 那霸活動預算（分）</label><input id="cfg_d3" type="number" min="0" max="720"></div>
<div class="row"><label>D4 石垣島活動預算（分）</label><input id="cfg_d4" type="number" min="0" max="720"></div>
<div class="row"><label>一則留言折算票數</label><input id="cfg_cmtw" type="number" min="0" max="2" step="0.5"></div>
<button class="btn" onclick="saveCfg()">儲存參數</button>
<button class="btn ghost" onclick="resetCfg()">恢復預設（390／480／450／0.5）</button>
<div id="msg"></div>
</div>
<div class="card"><h2>📏 開放規則</h2>
<p class="rule"><b>只能新增</b>：任何人可提案新景點／餐廳／購物／伴手禮，審核後自動加入。</p>
<p class="rule"><b>不能刪除</b>：刪除只能按「建議刪除」附理由，管理者確認才執行。</p>
<p class="rule"><b>初稿保護</b>：排程變動（替換／調時間）一律先出建議書，管理者確認才改檔。</p>
</div>
<div class="card"><h2>🛡 管理者</h2>
<p class="rule">待審清單（新增提案／建議刪除／排程建議）透過 Telegram 審核，確認後由排程器套用＋push。</p>
<p class="rule">每日 08:00 自動產出投票加權排程 digest（Gemini 3.5 flash lite）。</p>
</div>
<div class="note">參數仅影响下一次排程計算・不影響已發布行程</div>
<script>
var DEF={d2:390,d3:480,d4:450,cmtw:0.5},KEY='plan_cfg_v1';
function loadCfg(){try{return Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){return Object.assign({},DEF);}}
function paintCfg(){var c=loadCfg();document.getElementById('cfg_d2').value=c.d2;document.getElementById('cfg_d3').value=c.d3;document.getElementById('cfg_d4').value=c.d4;document.getElementById('cfg_cmtw').value=c.cmtw;}
function saveCfg(){var c={d2:+document.getElementById('cfg_d2').value||DEF.d2,d3:+document.getElementById('cfg_d3').value||DEF.d3,d4:+document.getElementById('cfg_d4').value||DEF.d4,cmtw:+document.getElementById('cfg_cmtw').value||0};localStorage.setItem(KEY,JSON.stringify(c));document.getElementById('msg').textContent='已儲存，下次排程生效';}
function resetCfg(){localStorage.removeItem(KEY);paintCfg();document.getElementById('msg').textContent='已恢復預設';}
paintCfg();
</script>
</body>
</html>
