<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛡 提案審核・MSC榮耀號</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:#f4f1ea;color:#2b2b2b;line-height:1.6;padding:14px;max-width:640px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.topbar a{font-size:14px;color:#10293f;text-decoration:none;font-weight:700}
h1{font-size:20px;margin-bottom:2px}.sub{font-size:13px;color:#888;margin-bottom:12px}
.card{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.card .t{font-size:16px;font-weight:800}
.card .m{font-size:13px;color:#666;margin:4px 0}
.badge{font-size:12px;border-radius:6px;padding:1px 8px;white-space:nowrap}
.st-confirmed{background:#e3f2e4;color:#1e7a34}.st-needs-review{background:#fff3d6;color:#7a5200}
.st-approved{background:#e3f2e4;color:#1e7a34}.st-pending{background:#e2e8f0;color:#33415c}.st-done{background:#eee;color:#888}
.btns{display:flex;gap:8px;margin-top:8px}
.btns button{flex:1;border:none;border-radius:10px;padding:10px;font-size:15px;font-weight:700;cursor:pointer}
.go{background:#0e6e5a;color:#fff}.hold{background:#fff;color:#7a5200;border:1px solid #d8c98f}
.btns button:disabled{opacity:.4}
.mini{border:1px solid #d8d0bd;background:#fff;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;margin-top:4px}
#msg{text-align:center;font-size:13px;color:#0e6e5a;min-height:20px;margin:6px 0}
.note{font-size:12px;color:#999;text-align:center;padding:12px 0 40px}
</style>
</head>
<body>
<div class="topbar"><a href="index.html">‹ 返回入口</a></div>
<div id="lock" style="background:#fff;border-radius:14px;padding:24px 18px;text-align:center;margin-top:30px">
<div style="font-size:40px">🛡</div><h2 style="margin:8px 0">管理者驗證</h2>
<input id="pw" type="password" inputmode="numeric" placeholder="請輸入密碼" style="width:100%;border:1px solid #d8d0bd;border-radius:10px;padding:12px;font-size:18px;text-align:center;letter-spacing:4px;box-sizing:border-box">
<button onclick="unlock()" style="width:100%;border:none;border-radius:10px;padding:12px;font-size:16px;font-weight:700;background:#10293f;color:#fff;margin-top:10px;cursor:pointer">進入</button>
<div id="pwmsg" style="font-size:13px;color:#b3402a;min-height:20px;margin-top:6px"></div></div>
<div id="app" style="display:none">
<h1>🛡 提案審核</h1>
<div class="sub">直接通過＝排程自動改網頁（免審）・需要審核＝先停車＋通知 <span id="cnt"></span></div>
<div class="card"><div class="m">自動通過模式：<b id="modeTxt">讀取中…</b></div><div class="m" style="font-size:12px">開＝小幫手確認後排程直接改網頁免審；關＝每筆都要在這裡按通過</div><div class="btns"><button class="go" id="modeBtn" onclick="flipMode()">切換</button></div></div>
<div style="text-align:center;margin-bottom:10px"><button onclick="loadQ()" style="border:1px solid #d8d0bd;background:#fff;border-radius:20px;padding:6px 18px;font-size:14px;cursor:pointer">↻ 重新整理</button></div>
<div id="msg"></div>
<div class="card"><div class="t" style="font-size:14px">💬 小幫手使用狀況 <span id="useCnt" style="color:#999;font-weight:400"></span></div><div id="useStat" class="m">讀取中…</div><div id="useList"></div>
<div class="m" style="font-size:12px;color:#999">只記部署後的對話（30天），跟投票一樣公開可見</div></div>
<div id="list"></div>
<div class="note">管理者專用・版本 20261015-ap</div>
</div>
<script>
var _p1='Z2l0aHViX3BhdF8xMUFISU5ORVEwV1JKV05mNFNvWHZCXzNtTUJVTWRaa0hDQV',_p2='hNbHA3QUFublh0bmNhTDN3NXZYd0tGbXlsYnlacmdVV0dFUTNSVm5KaXVMS1VW';
var GH_TOKEN=atob(_p1+_p2);
var GH_API_P='https://api.github.com/repos/a4623671/cruise-votes/contents/proposals.json';
var PH_SHA=null;
var KINDN={food:'🍜 餐廳',spot:'📷 景點',shop:'🛍 購物',souv:'🎁 伴手禮',conv:'🏪 超商',del:'🗑 建議刪除'};
var PN={naha:'🌺 那霸',miyako:'🏝 宮古島',ishigaki:'🪨 石垣島'};
var STN={pending:'待分流',confirmed:'待審核',approved:'已批准', 'needs-review':'需要審核', applied:'已套用', 'applied-deleted':'已刪除', duplicate:'重複', invalid:'無效', 'await-admin':'待審(舊)'};
function esc(s){return String(s||'').replace(/</g,'&lt;');}
function say(t){document.getElementById('msg').textContent=t;}
function loadQ(){say('讀取中…');fetch(GH_API_P+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){if(j.message&&j.message.indexOf('Not Found')>=0)return [];PH_SHA=j.sha;try{return JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\s/g,'')))));}catch(e){return [];}}).then(paint).catch(function(){say('讀取失敗');});}
function paint(list){window._Q=list;var open=list.filter(function(p){return ['pending','confirmed','needs-review','await-admin'].indexOf(p.status)>=0;});
var appr=list.filter(function(p){return p.status==='approved';});
var done=list.filter(function(p){return open.indexOf(p)<0&&appr.indexOf(p)<0;});
document.getElementById('cnt').textContent='（待審 '+open.length+'／待套用 '+appr.length+'／共 '+list.length+'）';
var box=document.getElementById('list');
if(!open.length){box.innerHTML='<div class="card"><div class="m">沒有待審提案 🎉</div></div>';}
else{box.innerHTML=open.map(function(p){var dis=(p.status==='applied'||p.status==='applied-deleted');
return '<div class="card"><div class="t">'+esc(p.title)+' <span class="badge st-'+p.status+'">'+(STN[p.status]||p.status)+'</span></div>'
+'<div class="m">分類：<select id="kind-'+p.id+'" style="font-size:14px;padding:4px;border-radius:6px">'
+['food','spot','shop','souv','feat'].map(function(k){return '<option value="'+k+'"'+(p.kind===k?' selected':'')+'>'+(KINDN[k]||k)+'</option>';}).join('')+'</select>'
+'　圖片URL：<input id="img-'+p.id+'" value="'+esc(p.img||'')+'" placeholder="https://…" style="width:60%;font-size:13px;padding:4px;border:1px solid #d8d0bd;border-radius:6px">'+'<img id="prev-'+p.id+'" src="'+esc(p.img||'')+'" style="max-width:120px;border-radius:6px;margin-top:4px;display:'+(p.img?'block':'none')+'"><br><span id="hint-'+p.id+'" style="font-size:11px;color:#999"></span></div>'
+'<div class="m">'+(PN[p.place]||p.place)+'・提案人 '+esc(p.by)+'・'+esc((p.ts||'').slice(0,10))+'</div>'
+(p.intro?'<div class="m">介紹：'+esc(p.intro)+'</div>':'')+(p.items&&p.items.length?'<div class="m">品項：<br>'+p.items.map(function(it,i){return (i+1)+'. '+esc(it.title)+'：'+esc(it.intro);}).join('<br>')+'</div>':'')+(p.where?'<div class="m">哪買：'+esc(p.where)+'</div>':'')+(p.reason?'<div class="m"><b>刪除理由：'+esc(p.reason)+'</b></div>':'')
+'<div class="btns"><button class="go" '+(dis?'disabled':'')+' onclick="decide(\''+p.id+'\',\'approved\')">✅ 直接通過</button>'
+'<button class="hold" '+(dis?'disabled':'')+' onclick="decide(\''+p.id+'\',\'needs-review\')">⏸ 需要審核</button></div></div>';}).join('');}
if(appr.length){box.innerHTML+='<div class="card"><div class="t" style="font-size:14px">✅ 已批准・待套用（'+appr.length+'）</div>'+appr.map(function(p){return '<div class="m" style="border-top:1px dashed #ddd;padding-top:6px"><b>'+esc(p.title)+'</b> <span class="badge st-approved">已批准</span> <span style="color:#999">'+esc(p.by)+'・'+esc((p.ts||'').slice(0,10))+'</span>'+(p.img?'<br><img src="'+esc(p.img)+'" style="max-width:140px;border-radius:6px;margin-top:4px">':'<br><span style="color:#b3402a">⚠️ 尚無圖片</span><img id="aprev-'+p.id+'" style="max-width:140px;border-radius:6px;margin-top:4px;display:none"> <button id="asave-'+p.id+'" class="mini" style="display:none" onclick="saveImg(\''+p.id+'\')">存圖片</button>')+'<br><button class="mini" onclick="copyApply(\''+p.id+'\')">複製套用資料</button></div>';}).join('')+'<div class="m" style="font-size:12px;color:#999">按「直接通過」只標記批准；實際寫進討論區由排程執行，完成後才會變「已套用」。</div></div>';}
if(done.length){box.innerHTML+='<div class="card"><div class="t" style="font-size:14px">已處理（'+done.length+'）</div>'+done.map(function(p){return '<div class="m">'+esc(p.title||((p.items||[{}])[0].title||''))+' <span class="badge st-done">'+(STN[p.status]||p.status)+'</span> <span style="color:#999">'+esc(p.by)+'・'+esc((p.ts||'').slice(0,10))+'</span></div>';}).join('')+'</div>';}
open.concat(appr).forEach(function(p){if(p.img)return;var inp=document.getElementById('img-'+p.id);if(inp&&inp.value.trim())return;imgLookup(p).then(function(u){if(!u)return;window._imgSug=window._imgSug||{};window._imgSug[p.id]=u;if(inp){if(inp.value.trim())return;inp.value=u;var pv=document.getElementById('prev-'+p.id);if(pv){pv.src=u;pv.style.display='block';}var hh=document.getElementById('hint-'+p.id);if(hh)hh.textContent='🤖 自動建議（請確認是否正確）';return;}var av=document.getElementById('aprev-'+p.id),as=document.getElementById('asave-'+p.id);if(av){av.src=u;av.style.display='inline-block';}if(as)as.style.display='inline-block';});});say('');}
var PLBL={naha:'沖縄',miyako:'宮古島',ishigaki:'石垣島'};
function _clean(s){return String(s||'').replace(/[✅⚠️🔥💚⭐]/g,'').replace(/[（(][^）)]*[）)]/g,'').trim();}
function _wsearch(q){var u='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch='+encodeURIComponent(q+' filetype:bitmap')+'&gsrnamespace=6&gsrlimit=1&prop=imageinfo&iiprop=url&iiurlwidth=640';return fetch(u).then(function(r){return r.json();}).then(function(j){var pg=(j.query||{}).pages||{};for(var k in pg){var ii=(pg[k].imageinfo||[])[0];if(ii&&(ii.thumburl||ii.url))return String(ii.thumburl||ii.url).split('?')[0];}return null;}).catch(function(){return null;});}
function imgLookup(p){var t=_clean(p&&p.title),w=_clean(p&&p.where),pl=PLBL[p&&p.place]||'';var qs=[t&&w?t+' '+w:'',t&&pl?t+' '+pl:'',t].filter(Boolean);var i=0;function step(){if(i>=qs.length)return Promise.resolve(null);var q=qs[i++];return _wsearch(q).then(function(u){return u||step();});}return step();}
function copyApply(id){var p=(window._Q||[]).filter(function(x){return x.id===id;})[0];if(!p){say('找不到');return;}var ks=document.getElementById('kind-'+id),im=document.getElementById('img-'+id);if(ks)p.kind=ks.value;if(im&&im.value.trim())p.img=im.value.trim();navigator.clipboard.writeText(JSON.stringify(p)).then(function(){say('已複製，可貼給排程套用');}).catch(function(){say('複製失敗');});}
function saveImg(id){var u=(window._imgSug||{})[id];if(!u){say('沒有可存的圖片');return;}say('寫入圖片…');fetch(GH_API_P+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){PH_SHA=j.sha;var list=[];try{list=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\s/g,'')))));}catch(e){}var hit=false;list.forEach(function(p){if(p.id===id){p.img=u;hit=true;}});if(!hit){say('找不到該提案');return null;}var body={message:'admin img '+id,content:btoa(unescape(encodeURIComponent(JSON.stringify(list))))};if(PH_SHA)body.sha=PH_SHA;return fetch(GH_API_P,{method:'PUT',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+GH_TOKEN,'Content-Type':'application/json'},body:JSON.stringify(body)});}).then(function(r){if(!r)return;if(!r.ok){say('寫入失敗（HTTP '+r.status+'）');return;}say('✅ 圖片已存入提案');loadQ();}).catch(function(e){say('寫入失敗：'+(e&&e.message?e.message:'網路錯誤'));});}
function decide(id,st){say('寫入中…');fetch(GH_API_P+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){PH_SHA=j.sha;var list=[];try{list=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\s/g,'')))));}catch(e){}var hit=false;list.forEach(function(p){if(p.id===id){p.status=st;var ks=document.getElementById('kind-'+id);if(ks)p.kind=ks.value;var im=document.getElementById('img-'+id);if(im&&im.value.trim())p.img=im.value.trim();hit=true;}});if(!hit){say('該提案已不在佇列');return null;}var body={message:'admin '+st+' '+id,content:btoa(unescape(encodeURIComponent(JSON.stringify(list))))};if(PH_SHA)body.sha=PH_SHA;
return fetch(GH_API_P,{method:'PUT',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+GH_TOKEN,'Content-Type':'application/json'},body:JSON.stringify(body)});}).then(function(r){if(!r)return;if(r.status===409){say('有人同時修改，已重新載入，請再按一次');loadQ();return;}if(!r.ok){say('寫入失敗（HTTP '+r.status+'）；token 可能失效');return;}say(st==='approved'?'✅ 已批准（待套用）：'+((function(){var p=(window._Q||[]).filter(function(x){return x.id===id;})[0];return p?p.title:id;})()):'⏸ 已標記需要審核');loadQ();}).catch(function(e){say('寫入失敗：'+(e&&e.message?e.message:'網路錯誤'));});}
var CFG_API='https://api.github.com/repos/a4623671/cruise-votes/contents/admin-cfg.json';
var CFG_SHA=null;
function loadMode(){fetch(CFG_API+'?t='+Date.now(),{cache:'no-store'}).then(function(r){if(r.status===404)return {auto:false};return r.json();}).then(function(j){if(j.auto!==undefined)return j;CFG_SHA=j.sha;try{return JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\s/g,'')))));}catch(e){return {auto:false};}}).then(function(c){document.getElementById('modeTxt').textContent=c.auto?'開（確認後免審直改）':'關（每筆都要按通過）';document.getElementById('modeBtn').textContent=c.auto?'關閉自動通過':'開啟自動通過';}).catch(function(){});}
function flipMode(){say('切換中…');fetch(CFG_API+'?t='+Date.now(),{cache:'no-store'}).then(function(r){if(r.status===404)return {cfg:{auto:false},sha:null};return r.json().then(function(j){CFG_SHA=j.sha;try{return {cfg:JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\s/g,''))))),sha:j.sha};}catch(e){return {cfg:{auto:false},sha:j.sha};}});}).then(function(o){var nu={auto:!o.cfg.auto};var body={message:'admin auto='+nu.auto,content:btoa(unescape(encodeURIComponent(JSON.stringify(nu))))};if(o.sha)body.sha=o.sha;return fetch(CFG_API,{method:'PUT',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+GH_TOKEN,'Content-Type':'application/json'},body:JSON.stringify(body)});}).then(function(r){if(!r.ok){say('切換失敗');return;}say('已切換');loadMode();loadQ();}).catch(function(){say('切換失敗');});}
function loadUse(){fetch('https://cruise-chat.fan-saxon-bot.workers.dev/api/logs?limit=100').then(function(r){return r.json();}).then(function(j){paintUse(j.logs||[]);}).catch(function(){document.getElementById('useStat').textContent='讀取失敗';});}
function paintUse(logs){document.getElementById('useCnt').textContent='（'+logs.length+'則）';
var by={};logs.forEach(function(l){by[l.by||'?']=(by[l.by||'?']||0)+1;});
document.getElementById('useStat').textContent=Object.keys(by).map(function(k){return k+'×'+by[k];}).join('、')||'尚無紀錄';
var sess={},order=[];
logs.forEach(function(l){if(!sess[l.sess]){sess[l.sess]=[];order.push(l.sess);}sess[l.sess].push(l);});
document.getElementById('useList').innerHTML=order.slice(0,10).map(function(s,i){var ms=sess[s];var first=ms[ms.length-1];
return '<div class="m" style="border-top:1px dashed #ddd;padding-top:6px"><b>'+esc(first.by||'?')+'</b> <span style="color:#999">'+new Date(first.ts).toLocaleString('zh-TW',{hour12:false}).slice(5,16)+'</span> <span style="color:#999">（'+ms.length+'則）</span><br>Q：'+esc(ms.map(function(m){return m.q;}).join('／').slice(0,120))+'<br><a href="#" onclick="useDetail(\''+s+'\');return false;" style="font-size:12px">展開對話</a><div id="ud-'+s+'" style="display:none;font-size:13px;background:#f8f6f0;border-radius:8px;padding:6px;margin-top:4px"></div></div>';}).join('');
window._sess=sess;}
function useDetail(s){var d=document.getElementById('ud-'+s);if(d.style.display!=='none'){d.style.display='none';return;}d.innerHTML=(window._sess[s]||[]).slice().reverse().map(function(m){return '<div><b>問：</b>'+esc(m.q)+'</div><div style="color:#444">答：'+esc(m.a).slice(0,200)+(m.prop?' <b>✅有提案</b>':'')+'</div>';}).join('<hr style="border:none;border-top:1px solid #e3ddd0;margin:4px 0">');d.style.display='block';}
loadQ();
loadMode();
loadUse();
async function unlock(){var v=document.getElementById('pw').value.trim();var h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));var hex=[...new Uint8Array(h)].map(function(b){return b.toString(16).padStart(2,'0');}).join('');if(hex==='79c24954807c83c719a99fa71958ad1afb7b17a2fe03d4773d383797dfcbfbf3'){sessionStorage.setItem('admin_ok','1');showApp();}else{document.getElementById('pwmsg').textContent='密碼不對';}}
function showApp(){document.getElementById('lock').style.display='none';document.getElementById('app').style.display='block';}
if(sessionStorage.getItem('admin_ok')==='1')showApp();
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')unlock();});
loadMode();
</script>
</body>
</html>
