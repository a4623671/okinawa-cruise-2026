<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f2">
  <title>沖繩郵輪｜三港行程與討論</title>
  <link rel="stylesheet" href="naha.css?v=20261116-ports-r3">
  <link id="board-style" rel="stylesheet" href="trip-board.css?v=20261116-ports-r3">
  <script src="trip-data.js" defer></script>
  <script src="trip-timing.js" defer></script>
  <script src="naha-plan.js" defer></script>
  <script src="naha-content.js?v=20261116-ports-r2" defer></script>
  <script src="naha-catalog.js?v=20261116-ports-r3" defer></script>
  <script src="naha.js?v=20261116-ports-r3" defer></script>
</head>
<body>
  <header class="top">
    <div class="shell top-inner">
      <a class="brand" href="index.html">‹ 沖繩郵輪</a>
      <div class="top-actions">
        <button id="identity-button" class="quiet" type="button">我的名字</button>
        <button id="settings-button" class="quiet" type="button" data-trip-sync hidden>共用設定</button>
      </div>
    </div>
  </header>

  <main id="port-page" class="shell" data-view="itinerary">
    <nav class="ports" aria-label="停靠港口">
      <a href="naha.html?port=miyako#guide" data-port="miyako">宮古島<span>12/17</span></a>
      <a href="naha.html#guide" data-port="naha" aria-current="page">那霸<span>12/18</span></a>
      <a href="naha.html?port=ishigaki#guide" data-port="ishigaki">石垣島<span>12/19</span></a>
    </nav>

    <nav class="views" aria-label="港口頁面">
      <a href="#itinerary" data-view="itinerary" aria-current="page">行程</a>
      <a href="#schedule" data-view="schedule">排程</a>
      <a href="#guide" data-view="guide">攻略投票</a>
      <a href="#shopping" data-view="shopping">我的採買 <span id="shop-count" hidden></span></a>
    </nav>

    <div id="sync-banner" class="notice sync-banner" hidden>
      <p id="sync-message"></p>
      <button id="sync-button" class="button compact" type="button" hidden>再試一次</button>
    </div>
    <p id="notice" class="sr-only" role="status" aria-live="polite"></p>

    <section id="itinerary" class="pane board-theme" aria-labelledby="itinerary-heading">
      <div class="section-head">
        <h1 id="itinerary-heading">那霸行程</h1>
        <a id="final-link" class="text-link" href="final.html?day=2026-12-18">岸上觀光定稿 ↗</a>
      </div>
      <div class="dayinfo">
        <p class="day-meta"><time id="port-date" datetime="2026-12-18">12/18 星期五</time><span id="plan-stage">行程載入中</span></p>
        <dl class="day-times">
          <div><dt>下船</dt><dd id="off-time">—</dd></div>
          <div class="return-time"><dt>最晚回船</dt><dd id="return-time">—</dd></div>
          <div><dt>啟航</dt><dd id="depart-time">19:00</dd></div>
        </dl>
        <a id="port-pier" class="text-link" href="https://www.google.com/maps/search/?api=1&amp;query=26.2364909%2C127.6777349" target="_blank" rel="noopener">安謝新港・碼頭地圖 ↗</a>
      </div>
      <div id="plan-highlights" class="plan-highlights" hidden></div>
      <p id="plan-status" class="muted" role="status">正在讀取那霸的行程…</p>
      <div id="timeline" class="timeline" aria-label="停靠站順序"></div>
      <div class="pane-links">
        <a href="#schedule">編輯排程</a>
        <a href="#guide">看精選攻略和影片</a>
      </div>
    </section>

    <section id="schedule" class="pane" aria-labelledby="schedule-heading" hidden>
      <div class="section-head">
        <h1 id="schedule-heading">當天排程</h1>
        <a id="schedule-full" class="text-link frame-link" href="naha.html?full=1#schedule" target="_blank" rel="noopener">全螢幕排程 ↗</a>
      </div>
      <iframe id="schedule-frame" class="view-frame" data-src="plan.html" title="共用行程排程板" allow="clipboard-write"></iframe>
    </section>

    <section id="guide" class="pane" aria-labelledby="guide-heading" hidden>
      <div class="section-head">
        <h1 id="guide-heading">那霸攻略與投票</h1>
        <a class="text-link" href="#discussion">完整項目清單 →</a>
      </div>
      <p class="vote-help">喜歡就按「投一票」。按「已投票」可以取消。</p>
      <div id="card-filters" class="filters" role="group" aria-label="篩選精選推薦"></div>
      <div id="cards" class="cards"></div>
    </section>

    <section id="discussion" class="pane" aria-labelledby="discussion-heading" hidden>
      <div class="section-head">
        <h1 id="discussion-heading">完整項目清單</h1>
        <a class="text-link frame-link" href="#guide">回精選攻略</a>
      </div>
      <div id="catalog-tools" hidden>
        <label class="sr-only" for="catalog-query">搜尋完整項目</label>
        <input id="catalog-query" class="catalog-search" type="search" placeholder="搜尋品名、景點或店家" autocomplete="off">
        <div id="catalog-filters" class="filters catalog-filters" role="group" aria-label="類別"></div>
        <div class="catalog-options">
          <label><input id="catalog-mine" type="checkbox"> 只看我投的</label>
          <details>
            <summary>店家與排序</summary>
            <div class="catalog-selects">
              <label>店家<select id="catalog-store"><option value="">所有店家</option></select></label>
              <label>排序<select id="catalog-sort"><option value="default">預設順序</option><option value="votes">票數優先</option></select></label>
            </div>
          </details>
        </div>
      </div>
      <p id="catalog-status" class="muted catalog-status" role="status">正在讀取完整項目…</p>
      <button id="catalog-retry" class="button secondary" type="button" hidden>重新讀取</button>
      <div id="catalog-items" class="catalog-grid"></div>
      <nav id="catalog-pages" class="catalog-pages" aria-label="項目清單頁數" hidden>
        <button id="catalog-prev" class="button secondary" type="button">上一頁</button>
        <span id="catalog-page"></span>
        <button id="catalog-next" class="button secondary" type="button">下一頁</button>
      </nav>
    </section>

    <section id="shopping" class="pane" aria-labelledby="shopping-heading" hidden>
      <div class="section-head">
        <h1 id="shopping-heading">我的採買</h1>
        <p>你投過票的商品，到店買完就勾起來。</p>
      </div>
      <div id="shopping-list"></div>
    </section>

    <footer class="page-footer">
      <span id="data-status">正在讀取共用資料</span>
      <button id="reload-data" class="quiet" type="button">更新資料</button>
    </footer>
    <noscript><p><a href="guide.html">開啟完整討論清單</a> · <a href="plan.html">開啟排程板</a></p></noscript>
  </main>

  <iframe id="discussion-frame" data-src="guide.html" title="項目資料" tabindex="-1" aria-hidden="true" hidden></iframe>

  <dialog id="catalog-dialog" aria-labelledby="catalog-title">
    <div class="dialog-heading">
      <h2 id="catalog-title">項目介紹</h2>
      <button class="quiet" type="button" data-close>關閉</button>
    </div>
    <div id="catalog-detail"></div>
    <div id="catalog-detail-actions" class="card-actions"></div>
  </dialog>

  <dialog id="name-dialog" aria-labelledby="name-title">
    <form id="name-form">
      <h2 id="name-title">你叫什麼名字？</h2>
      <label for="member-name">名字</label>
      <input id="member-name" name="member" maxlength="12" autocomplete="nickname" required>
      <div class="dialog-actions">
        <button class="button secondary" type="button" data-close>取消</button>
        <button id="name-submit" class="button" type="submit">儲存名字</button>
      </div>
    </form>
  </dialog>

  <dialog id="comment-dialog" aria-labelledby="comment-title">
    <div class="dialog-heading">
      <h2 id="comment-title">留言</h2>
      <button class="quiet" type="button" data-close>關閉</button>
    </div>
    <div id="comments-list" class="comments-list"></div>
    <form id="comment-form">
      <label for="comment-input">你想說什麼？</label>
      <textarea id="comment-input" rows="3" maxlength="140" required></textarea>
      <div class="dialog-actions"><button id="comment-submit" class="button" type="submit">送出留言</button></div>
    </form>
  </dialog>

  <dialog id="schedule-dialog" aria-labelledby="schedule-title">
    <form id="schedule-form">
      <h2 id="schedule-title">排入那霸草稿</h2>
      <p id="schedule-venue" class="muted"></p>
      <div class="form-grid">
        <label>時段
          <select name="slot"><option value="morning">上午</option><option value="afternoon" selected>下午</option><option value="evening">晚上</option></select>
        </label>
        <label>停留分鐘
          <input name="duration" type="number" inputmode="numeric" min="5" max="120" step="1" required>
        </label>
      </div>
      <div id="schedule-preview" class="notice" role="status"></div>
      <div class="dialog-actions">
        <button class="button secondary" type="button" data-close>取消</button>
        <button id="schedule-submit" class="button" type="submit">排入草稿</button>
      </div>
    </form>
  </dialog>

</body>
</html>
