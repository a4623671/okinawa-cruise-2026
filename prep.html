<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSC榮耀號・搭船準備事項總整理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:#f4f1ea;color:#2b2b2b;line-height:1.7}
.topbar{background:#fff;border-bottom:1px solid #e3ddd0;padding:10px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.topbar a{color:#10293f;text-decoration:none;font-weight:700}
.topbar .sp{flex:1}
.topbar button{border:1px solid #d8d0bd;background:#fff;border-radius:20px;padding:6px 14px;font-size:14px;cursor:pointer}
.hero{background:linear-gradient(135deg,#123c2b,#1e7a4f);color:#fff;padding:20px 16px}
.hero h1{font-size:21px}.hero p{font-size:13px;opacity:.92;margin-top:4px}
.wrap{padding:14px 12px 60px;max-width:760px;margin:0 auto}
.zone{border-radius:14px;padding:4px 12px 12px;margin:14px 0}
.zone.cruise{background:#e9f3ec;border:2px solid #1e7a4f}
.zone.other{background:#fff;border:1px solid #d8d0bd}
.zone>h2{font-size:18px;margin:12px 2px 10px}
.zone.cruise>h2{color:#0d4d2e}.zone.other>h2{color:#555}
.chk{background:#fff;border:1px solid #d8d0bd;border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:14px}
.chk label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:#0e6e5a;flex:none;margin-top:3px}
.chk.done label{color:#999;text-decoration:line-through}
h3.st{font-size:15px;margin:14px 2px 8px;color:#0d4d2e}
.zone.other h3.st{color:#666}
.tip{font-size:13px;background:#fff8e1;border:1px dashed #d9b53a;border-radius:10px;padding:10px 12px;margin:10px 0}
.star{color:#b3541e;font-weight:800}
.prog{background:#fff;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700;position:sticky;top:51px;z-index:9;border:1px solid #d8d0bd}
.bar{height:8px;background:#eee;border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:#1e7a4f;width:0}
@media print{.topbar button{display:none}}
</style>
</head>
<body>
<div class="topbar"><a href="index.html">‹ 返回入口</a><div class="sp"></div><button onclick="window.print()">🖨 列印清單</button></div>
<div class="hero"><h1>🧳 MSC榮耀號・搭船準備事項</h1><p>2026/12/16 基隆出發・5天4夜・勾選式行前清單（勾選狀態存在本機）</p></div>
<div class="wrap">
<div class="prog"><span id="ptxt">準備進度 0/0</span><div class="bar"><i id="pbar"></i></div></div>

<div class="zone cruise">
<h2>🚢 郵輪專區（只有搭郵輪才需要的）</h2>

<h3 class="st">證件與報到 <span class="star">★必備</span></h3>
<div class="chk"><label><input type="checkbox"><span><b>護照正本</b>：效期 6 個月以上（至 2027/6/20 後）＋空白頁 2 頁以上。影本另外放行李箱一份。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>船票／登船憑證</b>：旅行社給的 e-ticket 列印＋手機存檔。基隆港務大樓報到用。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>信用卡</b>：登船時綁船上消費帳戶（本人＋額度夠）。建議帶 2 張不同發卡組織備用。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>暈船藥＋常用藥</b>：12 月東海風浪大，暈船藥（人生旅安等）出發前先吃；慢性病藥帶足天數＋2 天份量＋處方箋影本。</span></label></div>

<h3 class="st"><span class="star">★</span>磁鐵掛勾（郵輪神器，一款就夠）</h3>
<div class="tip">郵輪艙房牆壁和天花板全是<strong>金屬</strong>，磁鐵一吸就行，不打孔不傷牆，是老郵輪客 Top 1 必帶小物。</div>
<div class="chk"><label><input type="checkbox"><span><b>強力磁鐵掛勾（釹磁鐵・垂直承重 5kg 以上）4–6 個</b>：掛行程單、每日日報、外套、伴手禮袋、浴室晾小衣物。<b>房門外也是金屬可吸</b>，留紙條給同房家人（「我去14樓吃早餐」）超好用。夜市弱磁款吸不住，搜尋「強力磁鐵掛勾 5kg 郵輪」，一顆約 NT$30–60。</span></label></div>

<h3 class="st">服裝（三樣就好）</h3>
<div class="chk"><label><input type="checkbox"><span><b>白色上衣（白色之夜）</b>：榮耀號經典 White Party，帶一件白上衣即可參加甲板派對。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>拖鞋</b>：艙房內＋甲板泳池畔用，好穿脫防滑即可。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>泳衣</b>：船上泳池、SPA、滑水道用。泳帽只有下水游泳才需要備著，不游泳不用帶。</span></label></div>

<h3 class="st">船上消費與 APP</h3>
<div class="chk"><label><input type="checkbox"><span><b>MSC for Me APP</b>：出發前先安裝登入，船上查日報、訂餐廳、看帳單全靠它。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>船上網路方案</b>：MSC 船上 Wi-Fi 按裝置／航程計費不便宜，先查好價格；只靠岸上網路＋船上離線可省一筆。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>酒水＋服務費觀念</b>：酒水套餐按天計費，不喝酒單點即可；服務費按人按晚掛房帳。MSC 酒水自帶政策以船公司公告為準⚠️。</span></label></div>

<h3 class="st">🎪 船上活動推薦（榮耀號＋鑽石卡）</h3>
<div class="chk"><label><input type="checkbox"><span><b>付費馬戲團：太陽馬戲海上版 ✅</b>：Carousel Lounge 兩檔輪演（SYMA／VARÉLIA），約45分鐘。上船第一天立刻預約，常售罄，約€15/人⚠️以船上公告為準。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>免費劇院秀 ✅</b>：London Theatre 百老匯式歌舞秀，每晚兩場免費，用 MSC for Me APP 預約座位。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>穹頂燈光秀 ✅</b>：Galleria Bellissima 96米LED穹頂步行街，晚上逛街順便看，免費。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>鑽石卡權益先確認 ⚠️</b>：Voyagers Club Diamond 常見權益有優先登船＋專屬報到、會員迎賓酒會、迎賓禮、免費洗衣、未來航次折扣＋船上消費金、限定活動邀請（名額有限）。<b>每航次內容不同</b>：出發前查 Voyagers 帳戶email有無邀請，上船第一天去客服／Voyagers 櫃台拿本航次鑽卡活動時間表。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>付費餐廳訂一晚 ⚠️</b>：Butcher's Cut 牛排、HOLA Tacos 等特色餐廳（約US$20–50/人），Gala Night 選一晚去吃，建議上船先訂。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>付費設施看著辦</b>：F1模擬賽車、XD互動影院（單次約€10上下⚠️）；滑水道免費。Aurea Spa水療可問櫃台鑽卡有無優惠⚠️。</span></label></div>

<h3 class="st">🏊 免費設施一覽（榮耀號）</h3>
<div class="chk"><label><input type="checkbox"><span><b>滑水道水上樂園 ✅</b>：3條滑水道＋主泳池，全免費。海上日排隊最長，想玩避開中午尖峰，開放時間看每日日報。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>喜馬拉雅空中步道 ✅</b>：橫跨甲板高空的繩索步道（約60–80米），免費但有名額＋身高體重要求⚠️，先查日報開放時段早去排。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>泳池群 ✅</b>：戶外Atmosphere Pool＋室內有頂泳池＋多座按摩泡水池，全免費。12月戶外水涼，以室內池＋按摩池為主。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>運動中心＋慢跑甲板 ✅</b>：Sportplex體育館（籃球排球）、健身房（團體課程部分付費⚠️）、露天慢跑道，免費時段看日報。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>兒童青少年俱樂部 ✅</b>：LEGO合作分齡俱樂部（幼兒／兒童／青少年分開），免費。有帶小孩上船報到時登記即可。</span></label></div>

<h3 class="st">登船當天（12/16 基隆）</h3>
<div class="chk"><label><input type="checkbox"><span><b>14:00 前到港務大樓</b>：報到→掛行李牌→托運→安檢→登船，18:00 啟航關閘嚴格⚠️。隨身小包放證件藥物充電器泳衣（托運行李傍晚才到房）。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>救生演習＋晚餐梯次＋包車確認</b>：演習強制參加；主餐廳梯次先確認；自組包車跟司機確認碼頭接人方式＋回船時間。</span></label></div>
</div>

<div class="zone other">
<h2>🧳 其他區（一般旅行小物，與郵輪關聯低）</h2>
<div class="chk"><label><input type="checkbox"><span><b>日本 eSIM／漫遊</b>：三個靠港日導航＋查地圖用，台灣先買好下船即連。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>旅平險＋不便險</b>：海外醫療＋行程延誤，日本就醫貴務必保。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>日圓現金</b>：市場食堂計程車御朱印多只收現金，每人至少 ¥30,000–50,000，台灣先換好。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>多孔 USB 充電器＋萬國轉接頭</b>：船上歐規圓孔多、日本岸上扁孔，一組搞定全家充電。⚠️ 船公司可能禁延長線，不帶。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>行動電源＋充電線</b>：岸上一整天拍照導航用。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>耳塞</b>：艙房隔音普通＋走廊半夜人聲，淺眠者必備。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>盥洗包＋防曬＋護唇膏</b>：船上備品陽春；12 月沖繩紫外線仍強。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>離線地圖＋本行程 HTML</b>：Google Maps 先下載沖繩離線圖；行程指南在基隆先開一次快取。</span></label></div>
<div class="chk"><label><input type="checkbox"><span><b>岸上交通預算</b>：宮古石垣包車半日約¥18,000–30,000／台（5 人攤約¥4,000–6,000／人）；那霸計程車＋單軌約¥3,000–4,000／人／天。</span></label></div>
</div>

</div>
<script>
function upd(){var c=document.querySelectorAll('input[type=checkbox]');var d=0;document.querySelectorAll('.chk').forEach(function(b){var i=b.querySelector('input');b.classList.toggle('done',i.checked);if(i.checked)d++;});document.getElementById('ptxt').textContent='準備進度 '+d+'/'+c.length;document.getElementById('pbar').style.width=(c.length?d/c.length*100:0)+'%';try{localStorage.setItem('cruise_prep_v2',JSON.stringify(Array.prototype.map.call(c,function(x){return x.checked?1:0;})));}catch(e){}}
document.querySelectorAll('input[type=checkbox]').forEach(function(c){c.addEventListener('change',upd);});
try{var s=JSON.parse(localStorage.getItem('cruise_prep_v2')||'[]');document.querySelectorAll('input[type=checkbox]').forEach(function(c,i){if(s[i])c.checked=true;});}catch(e){}
upd();
</script>
</body>
</html>
